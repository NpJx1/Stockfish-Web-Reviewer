<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Reviewer Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-5 gap-8">
        
        <div class="space-y-6 lg:col-span-3">
            
            <div class="bg-gray-800 p-4 rounded-lg shadow-lg"> 
                <h1 class="text-2xl font-bold mb-4">Chess Game Reviewer with Stockfish</h1>

                <div class="flex space-x-2 mb-2">
                    <input type="text" id="username" placeholder="Username" class="px-2 py-1 rounded bg-gray-700 text-white w-full border border-gray-600 focus:outline-none text-sm">
                    <input type="text" id="year" placeholder="YYYY" class="px-2 py-1 rounded bg-gray-700 text-white w-20 border border-gray-600 focus:outline-none text-sm">
                    <input type="text" id="month" placeholder="MM" class="px-2 py-1 rounded bg-gray-700 text-white w-16 border border-gray-600 focus:outline-none text-sm">
                    <button id="fetchGamesBtn" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 text-sm rounded font-semibold transition whitespace-nowrap">Load Games</button>
                </div>

                <p class="text-xs text-gray-400 mb-4">Enter your Chess.com username, and the month as well as year of the games you'd like to analyze.</p>

                <div id="gameSelectorContainer" class="hidden space-y-2">
                    <select id="gameSelect" class="p-2 rounded bg-gray-700 text-white w-full border border-gray-600 focus:outline-none text-sm"></select>
                    <button id="analyzeBtn" class="bg-green-600 hover:bg-green-700 w-full py-2 rounded font-semibold transition text-sm">Analyze Selected Game</button>
                </div>

                <p id="statusMsg" class="text-sm text-gray-400 mt-2"></p>
            </div>
            
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                
                <div id="topPlayer" class="w-full max-w-xl mx-auto mb-2 text-gray-300 font-bold bg-gray-700 px-3 py-1 rounded hidden">
                    Top Player (Waiting...)
                </div>

                <div id="board" class="w-full max-w-xl mx-auto"></div>
                
                <div id="bottomPlayer" class="w-full max-w-xl mx-auto mt-2 text-gray-300 font-bold bg-gray-700 px-3 py-1 rounded hidden">
                    Bottom Player (Waiting...)
                </div>
                
                <div class="flex justify-center space-x-4 mt-6">
                    <button id="prevBtn" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition">Previous</button>
                    <button id="nextBtn" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition">Next</button>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg shadow-lg max-h-[85vh] overflow-y-auto lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Analysis Timeline</h2>
            <div id="analysisPanel" class="space-y-4">
                <p class="text-gray-400 text-sm">Enter your Chess.com details and click Load Games.</p>
            </div>
        </div>
        
    </div>
    
    <script src="app.js"></script>
 <div id="aiMascotContainer" class="fixed bottom-8 right-8 z-50 hidden flex-col items-end">
        
        <div id="aiBubble" class="mb-4 w-72 bg-gray-800 border border-gray-600 rounded-2xl shadow-2xl p-4 hidden transform transition-all duration-300 origin-bottom-right">
            
            <div id="aiPrompt" class="text-sm">
                <p class="mb-3 font-semibold text-white">Would you like an explanation of Move <span id="mascotMoveNumber" class="text-blue-400"></span>?</p>
                <div class="flex space-x-2">
                    <button id="mascotYesBtn" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded text-xs font-bold transition">Yes, explain it</button>
                    <button id="mascotNoBtn" class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-1 rounded text-xs transition">No thanks</button>
                </div>
            </div>

            <div id="aiExplanation" class="hidden text-sm text-blue-200">
                </div>
        </div>

        <div id="mascotIcon" class="w-16 h-16 bg-blue-600 rounded-full border-4 border-gray-800 shadow-xl cursor-pointer hover:scale-110 transition flex items-center justify-center relative">
            
            <img id="mascotImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=Grandmaster" alt="AI Coach" class="w-full h-full rounded-full object-cover">
            
            <span id="mascotDot" class="absolute top-0 right-0 w-4 h-4 bg-red-500 border-2 border-gray-800 rounded-full hidden"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
